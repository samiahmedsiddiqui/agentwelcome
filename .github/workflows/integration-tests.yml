name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  integration:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.4' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, curl, zip, sqlite3, pdo_sqlite
          coverage: none

      # Not setup-php's "tools: wp-cli": when its download fails, the step still passes.
      - name: Install WP-CLI
        env:
          VERSION: 2.12.0
          SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/wp-cli.phar" "https://github.com/wp-cli/wp-cli/releases/download/v$VERSION/wp-cli-$VERSION.phar"
          echo "$SHA256  $RUNNER_TEMP/wp-cli.phar" | sha256sum --check
          sudo install -m 755 "$RUNNER_TEMP/wp-cli.phar" /usr/local/bin/wp

      - name: Build the test site
        run: tests/integration/setup.sh
        env:
          WP_CLI: /usr/local/bin/wp

      - name: Install the plugin
        run: tests/integration/deploy.sh
        env:
          WP_CLI: /usr/local/bin/wp

      - name: Start the server
        run: tests/integration/serve.sh start

      - name: Run the integration suites
        run: tests/integration/run.sh
        env:
          WP_CLI: /usr/local/bin/wp

      - name: Show the server and debug logs
        if: failure()
        run: |
          tail -n 60 tests/integration/wp-test/server.log || true
          tail -n 60 tests/integration/wp-test/wp/wp-content/debug.log || true
